services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER:-kubo}:${POSTGRES_PASSWORD}@kubodb:5432/${POSTGRES_DB:-kubo}?serverVersion=16&charset=utf8
      API_KEY: ${API_KEY}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-'^https?://.*$'}
    depends_on:
      kubodb:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - jwt_keys:/var/www/html/config/jwt
      - app_images:/var/www/html/public/images
    restart: unless-stopped

  kubodb:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kubo}
      POSTGRES_USER: ${POSTGRES_USER:-kubo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-kubo}", "-U", "${POSTGRES_USER:-kubo}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
    restart: unless-stopped

volumes:
  database_data:
  jwt_keys:
  app_images:
