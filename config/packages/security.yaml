security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        users_in_memory: { memory: null }

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Firewall stateless pour les endpoints menu/catalogue
        # À migrer vers JWT : remplacer custom_authenticators par le bundle LexikJWT
        api_secured:
            pattern: ^/api/catalogue
            stateless: true
            provider: users_in_memory
            custom_authenticators:
                - App\Security\UserIdHeaderAuthenticator

        main:
            lazy: true
            provider: users_in_memory

    access_control:
        - { path: ^/api/catalogue, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
